services:

  mongodb:
    image: mongo:7
    container_name: auction_mongodb
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]

    ports:
      - "27018:27017"

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'rs.status().ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-init-replica:
    image: mongo:7
    depends_on:
      - mongodb
    restart: "no"
    entrypoint: >
      bash -c '
        until mongosh --host mongodb:27017 --quiet --eval "db.adminCommand({ ping: 1 }).ok" >/dev/null 2>&1; do
          sleep 2;
        done;

        mongosh --host mongodb:27017 --quiet --eval "
          const expectedHost = \"mongodb:27017\";

          try {
            const config = rs.conf();

            if (config.members[0].host !== expectedHost) {
              config.members[0].host = expectedHost;
              rs.reconfig(config);
              print(\"Replica set member host updated to \" + expectedHost);
            } else {
              print(\"Replica set already initialized\");
            }
          } catch (error) {
            rs.initiate({
              _id: \"rs0\",
              members: [{ _id: 0, host: expectedHost }]
            });
            print(\"Replica set initialized\");
          }
        "
      '

  redis:
    image: redis:7-alpine
    container_name: auction_redis

    ports:
      - "6385:6379"

    # Add --bind 0.0.0.0 before the password flag
    command: redis-server --bind 0.0.0.0 --requirepass auctionbidding

volumes:
  mongo_data:
